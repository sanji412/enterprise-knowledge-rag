# Document processing
chunk_size: 600
overlap: 100
chunk_tokenizer: gpt2
chunking:
  default_strategy: tiktoken
  allowed_strategies:
    - tiktoken
    - zh_structure
    - spacy
    - nltk
    - medical
    - legal
embeddings:
  default_profile: st_bge_large_zh
  profiles:
    st_bge_large_zh:
      provider: sentence_transformers
      framework: sentence_transformers
      model: BAAI/bge-large-zh-v1.5
      dimension: 1024
      options:
        normalize_embeddings: true
    ollama_nomic:
      provider: ollama
      framework: ollama
      model: nomic-embed-text
      dimension: 768
      options: {}
    st_minilm:
      provider: sentence_transformers
      framework: sentence_transformers
      model: all-MiniLM-L6-v2
      dimension: 384
      options: {}
    st_mpnet_base:
      provider: sentence_transformers
      framework: sentence_transformers
      model: all-mpnet-base-v2
      dimension: 768
      options: {}
    st_multi_qa_minilm:
      provider: sentence_transformers
      framework: sentence_transformers
      model: multi-qa-MiniLM-L6-cos-v1
      dimension: 384
      options: {}
    st_bge_small_en:
      provider: sentence_transformers
      framework: sentence_transformers
      model: BAAI/bge-small-en-v1.5
      dimension: 384
      options: {}

vector_store:
  backend: qdrant
  qdrant_url: http://localhost:16333
  chroma_path: data/embeddings/chroma

# File paths
data_dir: data/documents
output_dir: data/embeddings

# Logging
log_level: INFO

# Phase 3: cross-encoder reranking
reranker:
  model: BAAI/bge-reranker-v2-m3
  batch_size: 8
  score_threshold: 0.0
  top_k: 5

# Phase 3: context window (token counting for LLM prompt)
context:
  max_tokens: 4000
  tokenizer: BAAI/bge-large-zh-v1.5

# Phase 3: RAG generation (Ollama)
generation:
  model: qwen2.5-coder:14b
  stream: false
  cache_ttl: 300

# Phase 4: multi-provider LLM routing
llm:
  default_provider: deepseek
  default_model_by_provider:
    deepseek: deepseek-v4-flash
  allowed_models_by_provider:
    deepseek:
      - deepseek-v4-flash
      - deepseek-v4-pro
  request_timeout_seconds: 60

# Phase 4: API production controls
api:
  auth_enabled: true
  api_keys:
    - dev-key-1
  rate_limit_per_minute: 120
  redis_rate_limit_enabled: true
  redis_url: redis://localhost:6379/0

# Evaluation settings
# Inline scoring adds ~200 ms per response (NLI model warm after first call).
# Set DOC_PROFILE=demo to use a lighter profile without inline NLI scoring.
evaluation:
  inline_enabled: true
  nli_model: cross-encoder/nli-deberta-v3-small

grounding:
  min_retrieval_confidence: 0.05
  min_citation_score: 0.55
  refusal_answer: 当前知识库中没有足够依据回答该问题
